name: SauceDemo Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore
        working-directory: SauceDemoProject.Tests

      - name: Build
        run: dotnet build --no-restore
        working-directory: SauceDemoProject.Tests

      - name: Check Chrome version
        run: google-chrome --version

      - name: Check for missing Chrome shared library dependencies
        run: |
          CHROME_PATH=$(which google-chrome)
          echo "Chrome binary at: $CHROME_PATH"
          ldd "$CHROME_PATH" | grep "not found" || echo "No missing libraries detected"

      - name: Run tests (headless)
        run: dotnet test --no-build
        working-directory: SauceDemoProject.Tests
        env:
          TestSettings__Headless: "true"

      - name: Show ChromeDriver log
        if: always()
        run: |
          find . -name "chromedriver.log" -exec cat {} \; || echo "No log file found anywhere"